# keywords.json holds the canonical fonts, referenced as {{custom.*}} in templates.
[config]
import_json_files = ["./keywords.json"]

[config.wallpaper]
command = 'awww img --transition-type center "{{ image }}"'
set = true


[templates.kitty]
input_path = './templates/kitty-colors.conf'
output_path = '~/.config/kitty/matugen.conf'
post_hook = 'pkill -SIGUSR1 kitty 2>/dev/null || true'

[templates.neovim]
input_path = './templates/neovim.lua'
output_path = '~/.config/nvim/matugen.lua'
post_hook = 'pkill -SIGUSR1 -x nvim 2>/dev/null || true'

[templates.starship]
input_path = './templates/starship-colors.toml'
output_path = '~/.config/starship.toml'

[templates.hyprland_lua]
input_path = './templates/hyprland-colors.lua'
output_path = '~/.config/hypr/matugen.lua'
post_hook = 'hyprctl reload >/dev/null 2>&1 || true'

[templates.hyprland_conf]
input_path = './templates/hyprland-colors.conf'
output_path = '~/.config/hypr/matugen.conf'

[templates.ironbar]
input_path = './templates/colors.css'
output_path = '~/.config/ironbar/matugen.css'
post_hook = 'ironbar reload >/dev/null 2>&1 || true'

[templates.swaync]
input_path = './templates/colors.css'
output_path = '~/.config/swaync/matugen.css'
post_hook = 'pgrep -x swaync >/dev/null && timeout 3s swaync-client -rs >/dev/null 2>&1 || true'

[templates.swayosd]
input_path = './templates/colors.css'
output_path = '~/.config/swayosd/matugen.css'

[templates.wlogout]
input_path = './templates/colors.css'
output_path = '~/.config/wlogout/matugen.css'

[templates.qt5ct]
input_path = './templates/qtct-colors.conf'
output_path = '~/.config/qt5ct/colors/matugen.conf'

[templates.qt6ct]
input_path = './templates/qtct-colors.conf'
output_path = '~/.config/qt6ct/colors/matugen.conf'

[templates.vencord]
input_path = './templates/midnight-discord.css'
output_path = '~/.config/Vencord/themes/midnight-discord.css'

[templates.btop]
input_path = './templates/btop.theme'
output_path = '~/.config/btop/themes/matugen.theme'

[templates.gtk3]
input_path = './templates/gtk-colors.css'
output_path = '~/.config/gtk-3.0/gtk.css'
post_hook = 'gsettings set org.gnome.desktop.interface gtk-theme ""; gsettings set org.gnome.desktop.interface gtk-theme Orchis-Dark-Compact; gsettings set org.gnome.desktop.interface color-scheme "prefer-dark" || true'

[templates.gtk4]
input_path = './templates/gtk-colors.css'
output_path = '~/.config/gtk-4.0/colors.css'

[templates.sddm]
input_path = './templates/sddm-astronaut.conf'
output_path = '~/.cache/matugen/sddm-astronaut.conf'
post_hook = 'MATUGEN_SDDM_SYNC=1 ~/.config/dotfiles/scripts/update-sddm-theme.sh'

[templates.vicinae]
input_path = './templates/vicinae.toml'
output_path = '~/.local/share/vicinae/themes/matugen.toml'
post_hook = 'vicinae theme set matugen >/dev/null 2>&1 || true'

[templates.zed]
input_path = './templates/zed-colors.json'
output_path = '~/.config/zed/themes/matugen.json'

[templates.zellij]
input_path = './templates/zellij-theme.kdl.tera'
output_path = '~/.config/zellij/themes/matugen.kdl'
