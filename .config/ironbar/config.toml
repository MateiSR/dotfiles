name = "main"
position = "top"
layer = "bottom"
height = 44
margin = { top = 10, left = 10, right = 10 }
popup_gap = 14
popup_autohide = true
icon_theme = "Tela-dark"

[[start]]
type = "custom"
name = "launcher"
class = "launcher"
tooltip = "Applications"

[[start.bar]]
type = "button"
label = ""
on_click = "!vicinae toggle"

[[start]]
type = "clock"
name = "time"
format = " %H:%M"
format_popup = "%H:%M"

[[start]]
type = "clock"
name = "date"
format = " %a %d %b"
format_popup = "%A, %d %B %Y"

[[center]]
type = "workspaces"
all_monitors = false
sort = "index"
hidden = ["special:magic"]

[center.name_map]
6 = "1"
7 = "2"
8 = "3"
9 = "4"
10 = "5"

[[end]]
type = "tray"
icon_size = 14

[[end]]
type = "network_manager"
icon_size = 16
types_whitelist = ["ethernet", "wifi"]
on_click_left = "hyprctl dispatch \"hl.dsp.exec_cmd('nm-connection-editor')\""

[[end]]
type = "bluetooth"
icon_size = 16

[end.format]
not_found = ""
disabled = ""
enabled = ""
connected = ""
connected_battery = ""

[[end]]
type = "volume"
format = "{icon} {percentage}%"
mute_format = "{icon} {percentage}%"
show_sources = false

[[end]]
type = "custom"
name = "brightness"
class = "brightness"
show_if = "~/.config/ironbar/brightness.sh get"

[[end.bar]]
type = "button"
label = "󰃠 {{1000:~/.config/ironbar/brightness.sh get}}%"
on_click = "popup:toggle"

[[end.popup]]
type = "box"
orientation = "vertical"

[[end.popup.widgets]]
type = "label"
name = "brightness-title"
label = "󰃠  Brightness"

[[end.popup.widgets]]
type = "label"
name = "brightness-devices"
label = "{{1000:~/.config/ironbar/brightness.sh label}}"

[[end.popup.widgets]]
type = "slider"
name = "brightness-slider"
min = 5
max = 100
step = 5
length = 240
show_label = false
value = "1000:~/.config/ironbar/brightness.sh get"
on_change = "!~/.config/ironbar/brightness.sh set ${0%.*}"

[[end]]
type = "battery"
format = "{percentage}%"
show_if = "find /sys/class/power_supply -maxdepth 1 -name 'BAT*' -print -quit | grep -q ."

[[end]]
type = "notifications"
show_count = false
tooltip = "Notifications · right-click toggles DND"
on_click_right = "swaync-client --toggle-dnd --skip-wait"

[end.icons]
closed_none = ""
closed_some = ""
closed_dnd = ""
open_none = ""
open_some = ""
open_dnd = ""

[[end]]
type = "custom"
name = "power"
class = "power"

[[end.bar]]
type = "button"
label = ""
on_click = "popup:toggle"

[[end.popup]]
type = "box"
orientation = "vertical"

[[end.popup.widgets]]
type = "button"
class = "power-action"
label = ""
on_click = "!hyprlock"

[[end.popup.widgets]]
type = "button"
class = "power-action"
label = ""
on_click = "!hyprctl dispatch exit"

[[end.popup.widgets]]
type = "button"
class = "power-action"
label = ""
on_click = "!systemctl suspend"

[[end.popup.widgets]]
type = "button"
class = "power-action"
label = ""
on_click = "!systemctl reboot"

[[end.popup.widgets]]
type = "button"
class = "power-action destructive"
label = ""
on_click = "!systemctl poweroff"
