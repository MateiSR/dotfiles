name = "main"
position = "top"
layer = "bottom"
height = 44
margin = { top = 10, left = 10, right = 10 }
popup_gap = 14
popup_autohide = true
icon_theme = "Tela-dark"

[[start]]
type = "custom"
name = "launcher"
class = "launcher"
tooltip = "Applications"

[[start.bar]]
type = "button"
label = ""
on_click = "!vicinae toggle"

[[start]]
type = "clock"
name = "time"
format = " %H:%M"
format_popup = "%H:%M"

[[start]]
type = "clock"
name = "date"
format = " %a %d %b"
format_popup = "%A, %d %B %Y"

[[center]]
type = "workspaces"
all_monitors = false
sort = "index"
hidden = ["special:magic"]

[center.name_map]
6 = "1"
7 = "2"
8 = "3"
9 = "4"
10 = "5"

[[end]]
type = "tray"
icon_size = 14

[[end]]
type = "network_manager"
icon_size = 16
types_whitelist = ["ethernet", "wifi"]
on_click_left = "hyprctl dispatch \"hl.dsp.exec_cmd('nm-connection-editor')\""

[[end]]
type = "bluetooth"
icon_size = 16

[end.format]
not_found = ""
disabled = ""
enabled = ""
connected = ""
connected_battery = ""

[[end]]
type = "volume"
format = "{icon} {percentage}%"
mute_format = "{icon} {percentage}%"
show_sources = false
popup_orientation = "vertical"
truncate_popup = { mode = "end", max_length = 24 }
tooltip = "Volume · right-click for pavucontrol"
on_click_right = "hyprctl dispatch \"hl.dsp.exec_cmd('pavucontrol')\""

[[end]]
type = "custom"
name = "brightness"
class = "brightness"
show_if = "~/.config/ironbar/brightness.sh has 1"

[[end.bar]]
type = "button"
label = "󰃠 {{1000:~/.config/ironbar/brightness.sh get}}%"
on_click = "popup:toggle"

[[end.popup]]
type = "box"
orientation = "vertical"

[[end.popup.widgets]]
type = "box"
name = "brightness-header"

[[end.popup.widgets.widgets]]
type = "label"
name = "brightness-title"
label = "󰃠  Brightness"

[[end.popup.widgets.widgets]]
type = "button"
name = "brightness-sync"
label = "{{1000:~/.config/ironbar/brightness.sh sync-icon}}"
tooltip = "Link displays to one slider"
on_click = "!~/.config/ironbar/brightness.sh toggle"
show_if = "30000:~/.config/ironbar/brightness.sh has 2"

[[end.popup.widgets]]
type = "slider"
name = "brightness-slider"
show_if = "1000:~/.config/ironbar/brightness.sh synced"
min = 5
max = 100
step = 5
length = 260
show_label = false
value = "1000:~/.config/ironbar/brightness.sh get"
on_change = "!~/.config/ironbar/brightness.sh set all ${0%.*}"

# honey: one hardcoded row per display -- ironbar widgets are static config.
# Copy a brightness-row block and bump the index if a third display appears.

[[end.popup.widgets]]
type = "box"
class = "brightness-row"
show_if = "1000:~/.config/ironbar/brightness.sh row 1"

[[end.popup.widgets.widgets]]
type = "label"
class = "brightness-name"
label = "{{30000:~/.config/ironbar/brightness.sh label 1}}"

[[end.popup.widgets.widgets]]
type = "slider"
class = "brightness-slider"
min = 5
max = 100
step = 5
length = 190
show_label = false
value = "1000:~/.config/ironbar/brightness.sh get 1"
on_change = "!~/.config/ironbar/brightness.sh set 1 ${0%.*}"

[[end.popup.widgets]]
type = "box"
class = "brightness-row"
show_if = "1000:~/.config/ironbar/brightness.sh row 2"

[[end.popup.widgets.widgets]]
type = "label"
class = "brightness-name"
label = "{{30000:~/.config/ironbar/brightness.sh label 2}}"

[[end.popup.widgets.widgets]]
type = "slider"
class = "brightness-slider"
min = 5
max = 100
step = 5
length = 190
show_label = false
value = "1000:~/.config/ironbar/brightness.sh get 2"
on_change = "!~/.config/ironbar/brightness.sh set 2 ${0%.*}"

[[end]]
type = "battery"
format = "{percentage}%"
show_if = "find /sys/class/power_supply -maxdepth 1 -name 'BAT*' -print -quit | grep -q ."

[[end]]
type = "notifications"
show_count = false
tooltip = "Notifications · right-click toggles DND"
on_click_right = "swaync-client --toggle-dnd --skip-wait"

[end.icons]
closed_none = ""
closed_some = ""
closed_dnd = ""
open_none = ""
open_some = ""
open_dnd = ""

[[end]]
type = "custom"
name = "power"
class = "power"

[[end.bar]]
type = "button"
label = ""
on_click = "popup:toggle"

[[end.popup]]
type = "box"
orientation = "vertical"

[[end.popup.widgets]]
type = "button"
class = "power-action"
label = ""
on_click = "!hyprlock"

[[end.popup.widgets]]
type = "button"
class = "power-action"
label = ""
on_click = "!hyprctl dispatch \"hl.dsp.exit()\""

[[end.popup.widgets]]
type = "button"
class = "power-action"
label = ""
on_click = "!systemctl suspend"

[[end.popup.widgets]]
type = "button"
class = "power-action"
label = ""
on_click = "!systemctl reboot"

[[end.popup.widgets]]
type = "button"
class = "power-action destructive"
label = ""
on_click = "!systemctl poweroff"
