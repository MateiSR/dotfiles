
format = """
[░▒▓](#c5bfae)\
[ ⋏ ](bg:#c5bfae fg:#28231d)\
[](bg:#b36b20 fg:#c5bfae)\
$directory\
[](fg:#b36b20 bg:#423a31)\
$git_branch\
$git_status\
[](fg:#423a31 bg:#28231d)\
$nodejs\
$rust\
$golang\
$php\
$time\
[ ](fg:#28231d)\
\n$character"""

[directory]
# Style uses the new bronze accent for the background.
# Foreground is a dark color for high contrast.
style = "fg:#28231d bg:#b36b20" # CHANGED: Using the new accent color
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
# Style uses the first step down in the color fade (a warm, dark gray).
style = "bg:#423a31"
format = '[[ $symbol $branch ](fg:#c5bfae bg:#423a31)]($style)'

[git_status]
style = "bg:#423a31"
format = '[[($all_status$ahead_behind )](fg:#c5bfae bg:#423a31)]($style)'

[nodejs]
symbol = ""
# Style uses the darkest gray, blending into the terminal background.
style = "bg:#28231d"
format = '[[ $symbol ($version) ](fg:#c5bfae bg:#28231d)]($style)'

[rust]
symbol = ""
style = "bg:#28231d"
format = '[[ $symbol ($version) ](fg:#c5bfae bg:#28231d)]($style)'

[golang]
symbol = ""
style = "bg:#28231d"
format = '[[ $symbol ($version) ](fg:#c5bfae bg:#28231d)]($style)'

[php]
symbol = ""
style = "bg:#28231d"
format = '[[ $symbol ($version) ](fg:#c5bfae bg:#28231d)]($style)'

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:#28231d"
format = '[[  $time ](fg:#c5bfae bg:#28231d)]($style)'
